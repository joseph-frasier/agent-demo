<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" role="img">
<g style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  <rect width="280" height="130" rx="8" fill="#1A3A4A" style="fill:rgb(26, 58, 74);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- lighthouse beam -->
  <polygon points="140,25 110,80 170,80" fill="#2E6E8E" opacity="0.5" style="fill:rgb(46, 110, 142);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- lighthouse tower -->
  <rect x="128" y="45" width="24" height="40" rx="3" fill="#E8F4F0" style="fill:rgb(232, 244, 240);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="122" y="42" width="36" height="10" rx="2" fill="#2E6E8E" style="fill:rgb(46, 110, 142);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- light -->
  <circle cx="140" cy="40" r="8" fill="#FFD97A" style="fill:rgb(255, 217, 122);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- water -->
  <path d="M60,100 Q90,93 120,100 Q150,107 180,100 Q210,93 220,100" fill="none" stroke="#2E6E8E" stroke-width="2" mask="url(#imagine-text-gaps-nbf5jx)" style="fill:none;stroke:rgb(46, 110, 142);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M70,110 Q100,103 130,110 Q160,117 190,110 Q210,105 215,108" fill="none" stroke="#2E6E8E" stroke-width="1.5" opacity="0.6" mask="url(#imagine-text-gaps-nbf5jx)" style="fill:none;stroke:rgb(46, 110, 142);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="140" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#E8F4F0" letter-spacing="1" style="fill:rgb(232, 244, 240);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">HARBORLIGHT THERAPY</text>
</g>
</svg>
