  <path d="M115,66 Q140,58 165,66" fill="none" stroke="#C8832A" stroke-width="1" style="fill:none;stroke:rgb(200, 131, 42);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- steam wisps -->
  <path d="M120,38 Q116,28 120,20" fill="none" stroke="#8C6239" stroke-width="1.5" opacity="0.5" style="fill:none;stroke:rgb(140, 98, 57);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M140,35 Q136,25 140,17" fill="none" stroke="#8C6239" stroke-width="1.5" opacity="0.5" style="fill:none;stroke:rgb(140, 98, 57);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M160,38 Q156,28 160,20" fill="none" stroke="#8C6239" stroke-width="1.5" opacity="0.5" style="fill:none;stroke:rgb(140, 98, 57);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="140" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="400" fill="#8C6239" letter-spacing="1" style="fill:rgb(140, 98, 57);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">The Sourdough Collective</text>
